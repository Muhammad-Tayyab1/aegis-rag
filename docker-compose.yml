services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    environment:
      DATABASE_URL: "postgresql://rag:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-aegis_rag}"
      JWT_SECRET: "${JWT_SECRET:-development-only-change-me}"
      API_PORT: 4000
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:3000}"
      CONNECTOR_ENCRYPTION_KEY: "${CONNECTOR_ENCRYPTION_KEY:-}"
      TENANT_RATE_LIMIT_PER_MINUTE: "${TENANT_RATE_LIMIT_PER_MINUTE:-120}"
      SEMANTIC_CACHE_SIMILARITY: "${SEMANTIC_CACHE_SIMILARITY:-0.97}"
      SEMANTIC_CACHE_TTL_HOURS: "${SEMANTIC_CACHE_TTL_HOURS:-24}"
      COHERE_API_KEY: "${COHERE_API_KEY:-}"
      COHERE_RERANK_MODEL: "${COHERE_RERANK_MODEL:-rerank-v3.5}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      BILLING_QUERY_THRESHOLD: "${BILLING_QUERY_THRESHOLD:-0}"
      BILLING_WEBHOOK_URL: "${BILLING_WEBHOOK_URL:-}"
    ports: ["4000:4000"]
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma && npm run start --workspace=@aegis-rag/backend",
      ]
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    build: { context: ., dockerfile: apps/frontend/Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000/api }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
